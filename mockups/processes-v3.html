<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Processes v3 – EDGEX-109 phase 3 scenes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#f6f6f5; --surface:#fff; --sunken:#fafaf9; --hover:#f4f4f3; --selected:#efefee;
  --border:#e8e8e6; --divider:#f0f0ee;
  --ink:#141414; --text:#3a3a38; --muted:#73736f; --faint:#a3a39e; --ghost:#d6d6d2;
  --accent:#2272B4; --accent-soft:#eaf2fa;
  --good:#127a4a; --good-soft:#e9f6ef; --bad:#b42318; --bad-soft:#fdeeec; --warn:#a15c07; --warn-soft:#fdf3e3;
  --ai:#5b47d6; --ai-soft:#f3f1fd; --ai-line:#d9d3fa; --ai-arc:#7c5cf0;
  --ai-grad:linear-gradient(135deg,#2272B4 0%,#7c5cf0 100%);
  --ai-wash:linear-gradient(180deg,#f4f8fe 0%,#fbfbff 45%,#fff 100%);
  --shadow-float:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#e4e4e2;color:var(--text);font-size:13px;line-height:1.5;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;padding:1px 0}
svg.p{width:18px;height:18px;fill:currentColor;flex-shrink:0}
svg.s{width:14px;height:14px}svg.m{width:16px;height:16px}
.scene{margin:28px auto;width:1440px;background:var(--canvas);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.scene-h{background:#141414;color:#fff;padding:10px 18px;font-size:12px}.scene-h b{margin-right:10px;font-weight:600}.scene-h span{color:#a3a3a3}
.app{display:flex;min-height:900px;position:relative}
/* sidebar (approved shell v2.1) */
.side{width:232px;padding:10px;flex-shrink:0;display:flex;flex-direction:column;gap:1px}
.org{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 8px;margin-top:-10px}
.org b{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}.org i{font-style:normal;color:var(--accent)}.org svg{color:var(--faint)}
.srch{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;margin:2px 0 10px}
.srch svg{color:var(--faint)}
.srch kbd{margin-left:auto;font:500 11px Inter;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px;height:18px;display:grid;place-items:center;background:var(--sunken)}
.ng{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px;color:var(--muted);font-size:12px;font-weight:500}
.ng svg{color:var(--ghost)}.ng.shut svg{transform:rotate(-90deg)}
.ni{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;color:var(--text);font-size:13.5px;font-weight:500;white-space:nowrap}
.ni svg{color:var(--muted)}.ni.on{background:var(--selected);color:var(--ink)}.ni.on svg{color:var(--ink)}
.ni .b{margin-left:auto;font-size:11.5px;color:var(--muted)}
.side .grow{flex:1;min-height:16px}
.foot{border-top:1px solid var(--border);margin:6px -10px 0;padding:8px 10px 0;display:flex;flex-direction:column;gap:1px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hdr{height:44px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 8px 0 12px}
.hb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:500;font-size:12.5px;white-space:nowrap;position:relative}
.hb svg{color:var(--muted)}.hb.icon{width:30px;padding:0;justify-content:center}
.hb .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ink);border:1.5px solid var(--surface)}
.hb.oread{border-color:var(--ai-line)}.hb.orca svg{color:var(--ai)}
.hb.me{padding:0 8px 0 3px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:600;flex-shrink:0}
.frame{flex:1;margin:0 8px 8px 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;min-width:0;position:relative;overflow:hidden}

/* ---------- Home ---------- */
.home{padding:28px 32px 40px;max-width:1120px;margin:0 auto}
.h1{font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.lede{color:var(--muted);font-size:14px;margin-top:2px}.lede b{color:var(--ink);font-weight:500}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;margin-top:22px;align-items:start}
.label{color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
/* Orca read */
.oread{border:1px solid var(--ai-line);border-radius:16px;background:var(--ai-wash);padding:16px 18px 12px;margin-top:20px;position:relative}
.oread .oh{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;font-size:13.5px}
.oread .oh .spk{width:22px;height:22px;border-radius:7px;background:var(--ai-grad);display:grid;place-items:center;color:#fff}
.oread .oh .mt{color:var(--muted);font-weight:400;font-size:12.5px}
.oread .oh .r{margin-left:auto;display:flex;gap:2px;color:var(--faint)}
.oread .oh .r span{width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.oread ol{list-style:none;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.oread li{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--text);line-height:1.5}
.oread li .n{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--ai-line);color:var(--ai);font-size:11px;font-weight:600;display:grid;place-items:center;transform:translateY(2px)}
.oread li b{color:var(--ink);font-weight:500}
.oread li .go{color:var(--accent);font-weight:500;white-space:nowrap;margin-left:4px}
.oread .ask{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--ai-line)}
.oread .ask .in{flex:1;display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:0 10px;color:var(--faint);font-size:13px}
.oread .ask .in svg{color:var(--ai)}
.oread .ask .q{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px;display:inline-flex;align-items:center;white-space:nowrap}
/* section heads */
.sh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh h2{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.sh .c{font-size:12px;color:var(--muted);background:var(--sunken);border:1px solid var(--border);border-radius:9999px;padding:0 7px;height:20px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.sh .r{margin-left:auto;display:flex;gap:6px}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--border);border-radius:10px;padding:2px}
.seg div{padding:3px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg div i{font-style:normal;color:var(--faint);margin-left:4px}
.tier{display:flex;align-items:center;gap:8px;margin:16px 0 2px;padding:0 2px}
.tier .t{font-size:12px;font-weight:600;color:var(--ink)}
.tier .d{font-size:12px;color:var(--muted)}
/* action rows */
.list{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.it{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px 11px 14px;border-top:1px solid var(--divider);position:relative}
.it:first-child{border-top:0}
.it .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--sunken);border:1px solid var(--border);color:var(--text)}
.it .ic.bad{background:var(--bad-soft);border-color:#f6d5d1;color:var(--bad)}
.it .ic.warn{background:var(--warn-soft);border-color:#f3e0bf;color:var(--warn)}
.it .ic.new{background:var(--accent-soft);border-color:#cfe1f2;color:var(--accent)}
.it .tl{display:flex;align-items:center;gap:8px;min-width:0}
.it .nm{color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap}
.it .wh{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.it .wh b{color:var(--text);font-weight:500}
.it .wh q{color:var(--text);font-style:italic}
.it .ac{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid var(--border);background:var(--sunken);color:var(--text)}
.chip.bad{background:var(--bad-soft);border-color:#f6d5d1;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:#f3e0bf;color:var(--warn)}
.chip.good{background:var(--good-soft);border-color:#cde9da;color:var(--good)}
.chip.new{background:var(--accent-soft);border-color:#cfe1f2;color:var(--accent)}
.chip.ai{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:500;font-size:12.5px;white-space:nowrap}
.btn svg{color:var(--muted)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.pri svg{color:#fff}
.btn.ai{border-color:var(--ai-line);color:var(--ai);background:var(--surface)}.btn.ai svg{color:var(--ai)}
.btn.gh{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ico{width:30px;padding:0;justify-content:center}
.more{display:flex;align-items:center;gap:6px;padding:10px 14px;color:var(--accent);font-weight:500;font-size:12.5px;border-top:1px solid var(--divider);background:var(--sunken)}
/* right column cards */
.card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px 14px 10px}
.card+.card{margin-top:16px}
.card .ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .ch h3{font-size:13.5px;font-weight:600;color:var(--ink)}
.card .ch .r{margin-left:auto;color:var(--accent);font-size:12.5px;font-weight:500}
.ag{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--divider);align-items:baseline}
.ag:first-of-type{border-top:0}
.ag .tm{color:var(--ink);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.ag .tm.no{color:var(--faint);font-weight:400}
.ag .x{color:var(--text);font-size:13px;min-width:0}.ag .x span{display:block;color:var(--muted);font-size:12px}
.ag.now .tm{color:var(--accent)}
.met{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--divider);align-items:baseline}
.met:first-of-type{border-top:0}
.met .k{color:var(--text);font-size:13px}
.met .v{color:var(--ink);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.met .u{grid-column:1/-1;color:var(--muted);font-size:12px}
.met .u.bad{color:var(--bad)}.met .u.good{color:var(--good)}.met .u.warn{color:var(--warn)}
.pp{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--divider)}
.pp:first-of-type{border-top:0}
.pp .x{font-size:13px;color:var(--ink);font-weight:500;min-width:0}.pp .x span{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .v{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text);text-align:right}
.fl{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(20,20,20,.32);z-index:5}
.sheet{position:absolute;top:0;right:0;bottom:0;width:560px;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-float);z-index:6;display:flex;flex-direction:column}
.sheet .sh-h{padding:18px 22px 14px;border-bottom:1px solid var(--divider)}
.sheet .sh-h .t{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:var(--ink)}
.sheet .sh-h .t .x{margin-left:auto;color:var(--muted)}
.sheet .ctx{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.sheet .bd{padding:18px 22px;flex:1;display:flex;flex-direction:column;gap:14px}
.draft{border:1px solid var(--ai-line);border-radius:12px;background:var(--ai-wash);padding:14px 16px}
.draft .dh{display:flex;align-items:center;gap:8px;color:var(--ai);font-size:12.5px;font-weight:500;margin-bottom:8px}
.draft .dh .r{margin-left:auto;color:var(--muted);font-weight:400}
.draft p{font-size:14px;color:var(--ink);line-height:1.6}
.why{font-size:12.5px;color:var(--muted);line-height:1.55}.why b{color:var(--text);font-weight:500}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.chk .bx{width:16px;height:16px;border-radius:4px;background:var(--ink);display:grid;place-items:center;color:#fff}
.sheet .ft{padding:14px 22px;border-top:1px solid var(--divider);display:flex;gap:8px;align-items:center}
.sheet .ft .n{font-size:12px;color:var(--muted);margin-right:auto}
/* inline call log */
.log{background:var(--sunken);border-top:1px solid var(--divider);padding:12px 14px 14px 58px;display:flex;flex-direction:column;gap:10px}
.log .q{font-size:12.5px;color:var(--muted);font-weight:500}
.log .opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.opt.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.batch{display:flex;align-items:center;gap:12px;margin:4px 0 2px;padding:10px 12px 10px 14px;border:1px solid var(--ai-line);border-radius:12px;background:var(--ai-wash)}
.batch .bt{flex:1;font-size:13px;color:var(--text)}.batch .bt b{color:var(--ink);font-weight:500}.batch .bt span{display:block;color:var(--muted);font-size:12px}
.batch .spk{width:26px;height:26px;border-radius:8px;background:var(--ai-grad);display:grid;place-items:center;color:#fff;flex-shrink:0}
.sec{display:flex;flex-direction:column;gap:6px}.sec .label{margin-bottom:2px}
.kv2{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:13px}.kv2 span:nth-child(odd){color:var(--muted)}.kv2 span:nth-child(even){color:var(--ink)}
.gap{display:flex;flex-wrap:wrap;gap:6px}
.note{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:13px;color:var(--ink)}
.fill{border:1px solid var(--ai-line);border-radius:10px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fill .fh{display:flex;align-items:center;gap:6px;color:var(--ai);font-size:12.5px;font-weight:500}.fill .fh .r{margin-left:auto;color:var(--muted);font-weight:400}
.fr{display:grid;grid-template-columns:18px 130px 1fr;gap:8px;align-items:center;font-size:13px}.fr span:nth-child(2){color:var(--muted)}.fr span:nth-child(3){color:var(--ink);font-weight:500}
.cb{width:16px;height:16px;border-radius:4px;background:var(--ink);display:grid;place-items:center;color:#fff}.cb.off{background:var(--surface);border:1px solid var(--ghost)}
.bi{border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.bi .bh{display:flex;align-items:center;gap:8px}.bi .bh b{color:var(--ink);font-weight:500;font-size:13.5px}.bi .bh .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.bi p{font-size:13px;color:var(--text);line-height:1.55}
.opt-banner{margin:0 0 12px;padding:8px 12px;border-radius:10px;border:1px dashed #e8590c;color:#b8470a;font-size:12.5px;background:#fff7f2}
/* pins + legend */
.pin{position:absolute;width:20px;height:20px;border-radius:50%;background:#e8590c;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;z-index:12;box-shadow:0 0 0 2px #fff}
.legend{padding:18px 22px 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 32px;border-top:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text);line-height:1.5}
.legend div{display:flex;gap:10px}.legend div>b:first-child{flex-shrink:0;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e8590c;color:#fff;font-size:11px}
.legend em{font-style:normal;color:var(--muted)}
/* phone */
.phone{width:390px;height:820px;border:10px solid #141414;border-radius:36px;overflow:hidden;position:relative;background:var(--canvas)}
.ph-hdr{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px}
.ph-frame{margin:0 6px;background:var(--surface);border:1px solid var(--border);border-radius:16px;height:740px;overflow:hidden;padding:18px 14px}
/* ratings table */
.rt{width:100%;border-collapse:collapse;background:var(--surface);font-size:13px}
.rt th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--sunken)}
.rt td{padding:10px 16px;border-bottom:1px solid var(--divider);vertical-align:top;color:var(--text)}
.rt td:first-child{color:var(--ink);font-weight:500;width:300px}
.rt td.s{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;width:60px;text-align:center}

.pg{padding:28px 32px 40px;max-width:1160px;margin:0 auto}
.pg .crumb{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.pg .crumb b{color:var(--ink);font-weight:500}
.vchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--sunken);color:var(--text);white-space:nowrap}
.vchip.live{background:var(--good-soft);border-color:#cde9da;color:var(--good)}
.vchip.draft{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai)}
.vchip.warn{background:var(--warn-soft);border-color:#f3e0bf;color:var(--warn)}
.vchip.bad{background:var(--bad-soft);border-color:#f6d5d1;color:var(--bad)}
/* process list */
.plist{display:flex;flex-direction:column;gap:12px}
.pc{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:36px minmax(0,1fr) 250px 128px;gap:14px;align-items:center}
.pc .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunken);border:1px solid var(--border);color:var(--text)}
.pc .ic.bad{background:var(--bad-soft);border-color:#f6d5d1;color:var(--bad)}
.pc .ic.warn{background:var(--warn-soft);border-color:#f3e0bf;color:var(--warn)}
.pc .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc .t b{color:var(--ink);font-weight:600;font-size:14.5px}
.pc .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.pc .k .v{color:var(--ink);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.pc .k .v.bad{color:var(--bad)}.pc .k .v.warn{color:var(--warn)}.pc .k .v.good{color:var(--good)}
.pc>div:last-child{text-align:right}
.pc .k .l{color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:9999px;background:var(--selected);overflow:hidden;margin-top:5px;position:relative}
.bar i{display:block;height:100%;border-radius:9999px;background:var(--bad)}
.bar i.warn{background:var(--warn)}.bar i.good{background:var(--good)}
.bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
/* improvements log */
.ilog .e{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--divider)}
.ilog .e:first-of-type{border-top:0}
.ilog .e .d{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--sunken);border:1px solid var(--border);color:var(--muted)}
.ilog .e .d.ai{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai)}
.ilog .e .d.good{background:var(--good-soft);border-color:#cde9da;color:var(--good)}
.ilog .e .x{font-size:13px;color:var(--text)}.ilog .e .x b{color:var(--ink);font-weight:500}
.ilog .e .x span{display:block;color:var(--muted);font-size:12px}
/* map */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:14px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
.st{padding:14px 14px 12px;border-left:1px solid var(--divider);position:relative;min-width:0}
.st:first-child{border-left:0}
.st .n{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.st .n i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);border:1px solid var(--border);color:var(--ink);font-size:10.5px;letter-spacing:0}
.st .n i.bad{background:var(--bad);border-color:var(--bad);color:#fff}.st .n i.warn{background:var(--warn);border-color:var(--warn);color:#fff}.st .n i.good{background:var(--good);border-color:var(--good);color:#fff}
.st h4{color:var(--ink);font-size:14px;font-weight:600;margin-top:6px}
.st .who{color:var(--muted);font-size:12px;margin-top:1px}
.st .tg{margin-top:10px;font-size:12px;color:var(--muted)}.st .tg b{color:var(--ink);font-weight:500}
.st .now{margin-top:6px;font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.st .now.bad{color:var(--bad)}.st .now.warn{color:var(--warn)}.st .now.good{color:var(--good)}
.st .now small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.st .det{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.st .dr{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
.st .dr span{font-size:11px;color:var(--text);border:1px dashed var(--ghost);border-radius:5px;padding:1px 6px;white-space:nowrap}
.st:not(:last-child)::after{content:"";position:absolute;right:-7px;top:22px;width:12px;height:12px;background:var(--surface);border-top:1px solid var(--divider);border-right:1px solid var(--divider);transform:rotate(45deg);z-index:1}
/* sop doc */
.sop{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:6px 18px 14px}
.sop .row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid var(--divider);font-size:13px;color:var(--text)}
.sop .row:first-child{border-top:0}
.sop .row .h{color:var(--muted);font-size:12px;font-weight:500;padding-top:1px}
.sop ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.sop ol li b{color:var(--ink);font-weight:500}
.sop code{font:500 11.5px ui-monospace,Menlo,monospace;color:var(--muted);background:var(--sunken);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.side2 .card{padding:14px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:12.5px}
.kv .k{color:var(--muted)}.kv .v{color:var(--ink)}
/* orca suggestion card */
.sug{border:1px solid var(--ai-line);border-radius:12px;background:var(--ai-wash);padding:14px}
.sug .oh{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);font-size:13.5px}
.sug .oh .spk{width:22px;height:22px;border-radius:7px;background:var(--ai-grad);display:grid;place-items:center;color:#fff}
.sug p{font-size:13px;color:var(--text);margin-top:8px}
/* diff */
.chg{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px 16px}
.chg+.chg{margin-top:12px}
.chg .top{display:flex;align-items:center;gap:10px}
.chg .top b{color:var(--ink);font-size:14px;font-weight:600}
.chg .top .r{margin-left:auto;display:flex;gap:6px}
.chg .ba{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:10px;margin-top:10px;align-items:stretch}
.chg .ba>div{border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5}
.chg .ba .old{background:var(--sunken);border:1px solid var(--border);color:var(--muted);text-decoration-color:var(--ghost)}
.chg .ba .new{background:var(--good-soft);border:1px solid #cde9da;color:var(--ink)}
.chg .ba .arr{display:grid;place-items:center;color:var(--faint)}
.chg .ba .lb{display:block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chg .ev{margin-top:10px;font-size:12.5px;color:var(--text);display:flex;gap:8px;align-items:baseline}
.chg .ev .lbl{color:var(--ai);font-weight:500;white-space:nowrap}
.chg .ev b{color:var(--ink);font-weight:500}
.chg .drv{margin-top:8px;font-size:12px;color:var(--muted)}
.tog{width:34px;height:20px;border-radius:9999px;background:var(--ink);position:relative;flex-shrink:0}
.tog::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.tog.off{background:var(--ghost)}.tog.off::after{right:auto;left:2px}
.approve{position:sticky;bottom:0;margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 -1px 0 var(--divider)}
.approve .x{font-size:12.5px;color:var(--muted)}.approve .x b{color:var(--ink);font-weight:500}
.approve .r{margin-left:auto;display:flex;gap:8px}
/* versions / before-after */
.vt{display:flex;align-items:center;gap:0;margin-top:14px}
.vt .v{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface);min-width:0;flex:1}
.vt .v.cur{border-color:#cde9da;background:var(--good-soft)}
.vt .v b{color:var(--ink);font-size:13px;font-weight:600}
.vt .v span{display:block;color:var(--muted);font-size:12px}
.vt .ln{width:28px;height:1px;background:var(--border);flex-shrink:0}
.ba-t{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.ba-t th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--sunken)}
.ba-t td{padding:10px 12px;border-bottom:1px solid var(--divider);color:var(--text);font-variant-numeric:tabular-nums}
.ba-t td.m{color:var(--ink);font-weight:500}
.ba-t td.b{color:var(--muted)}
.ba-t td.a{color:var(--ink);font-weight:600}
.ba-t td.d{font-weight:500}.ba-t td.d.good{color:var(--good)}.ba-t td.d.bad{color:var(--bad)}
.example{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--warn-soft);border:1px solid #f3e0bf;color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-top:18px}
.tabs div{padding:8px 12px;font-size:13px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs div.on{color:var(--ink);border-color:var(--ink)}
.tabs div i{font-style:normal;color:var(--faint);margin-left:4px}

/* ---------- phase 2 scenes (S1–S4) ---------- */
.fld{display:flex;flex-direction:column;gap:6px}
.fld .lb2{font-size:12.5px;font-weight:500;color:var(--ink)}
.fld .hint{font-size:12px;color:var(--muted)}
.picks{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.pk{display:grid;grid-template-columns:18px 22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--divider);font-size:13px;color:var(--text)}
.pk:first-child{border-top:0}
.pk.on{background:var(--accent-soft)}
.pk .rd{width:14px;height:14px;border-radius:50%;border:1px solid var(--ghost);background:var(--surface)}
.pk.on .rd{border:4px solid var(--accent)}
.pk .ni2{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;background:var(--bad)}
.pk .ni2.n{background:var(--sunken);border:1px solid var(--border);color:var(--ink)}.pk .ni2.warn{background:var(--warn)}
.pk b{color:var(--ink);font-weight:500}.pk .v{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--text)}
.inp{height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:13px}
.inp.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp svg{color:var(--muted)}
.ta{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:9px 11px;font-size:13px;color:var(--ink);line-height:1.5;min-height:74px}
.nowbox{border:1px solid var(--border);border-radius:9px;background:var(--sunken);padding:8px 11px;font-size:12.5px;color:var(--muted);line-height:1.5}
.nowbox .lb{display:block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.evc{display:flex;flex-direction:column;gap:6px}
.ec{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text);padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.ec.on{border-color:#cfe1f2;background:var(--accent-soft)}
.ec .cb{margin-top:1px}
.ec b{color:var(--ink);font-weight:500}
.drvbox{font-size:12px;color:var(--muted);border-top:1px solid var(--divider);padding-top:10px}
.drvbox b{color:var(--text);font-weight:500}
.dlg-scrim{position:absolute;inset:0;background:rgba(20,20,20,.32);z-index:5}
.dlg{position:absolute;left:50%;top:210px;transform:translateX(-50%);width:460px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-float);z-index:6}
.dlg .dh2{padding:16px 18px 6px;font-size:16px;font-weight:600;color:var(--ink)}
.dlg .db{padding:4px 18px 14px;display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--text)}
.dlg .df{padding:12px 18px;border-top:1px solid var(--divider);display:flex;gap:8px;justify-content:flex-end}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.young{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border:1px solid #cfe1f2;background:var(--accent-soft);border-radius:10px;font-size:13px;color:var(--text)}
.young svg{color:var(--accent);margin-top:1px}.young b{color:var(--ink);font-weight:500}
.ba-t td.wait{color:var(--faint)}
.daygrp{margin-top:18px}
.daygrp .dl{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 6px 2px}
.ev2{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--divider)}
.ev2:first-child{border-top:0}
.ev2 .d{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunken);border:1px solid var(--border);color:var(--muted)}
.ev2 .d.good{background:var(--good-soft);border-color:#cde9da;color:var(--good)}
.ev2 .d.bad{background:var(--bad-soft);border-color:#f6d5d1;color:var(--bad)}
.ev2 .d.new{background:var(--accent-soft);border-color:#cfe1f2;color:var(--accent)}
.ev2 .x{font-size:13.5px;color:var(--text);min-width:0}.ev2 .x b{color:var(--ink);font-weight:500}
.ev2 .x span{display:block;color:var(--muted);font-size:12px;margin-top:1px}

.res{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:5px}

    if(g.label){ if(!admin&&g.key==='grow'){} h+=`<div class="ng${g.items.length?'':' shut'}">${g.label}${I('caret-down','s')}</div>`;}
    for(const [k,ic,label] of items) h+=`<div class="ni${k===(o.on||'home')?' on':''}">${I(ic)}${label}${k==='inbox'&&o.unread?`<span class="b">${o.unread}</span>`:''}</div>`;

  h+=`<div class="grow"></div><div class="foot"><div class="ni">${I('archive')}Archive</div>${admin?`<div class="ni">${I('gear')}Settings</div>`:''}</div></aside>`;
  return h;
}

.sel{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;display:inline-flex;align-items:center;gap:18px;color:var(--ink);font-size:13px;background:var(--surface)}
.sel svg{color:var(--faint)}
.ev{margin-top:16px;border:1px solid var(--border);border-radius:10px;background:var(--sunken);padding:10px 12px;font-size:12.5px;color:var(--text);line-height:1.55}
.ev b{color:var(--ink);font-weight:500}
.ev .hd{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.wk div{text-align:center;font-size:11.5px;color:var(--muted)}
.wk i{display:block;height:34px;border-radius:5px;background:var(--selected);position:relative;margin-bottom:3px}
.wk i u{position:absolute;left:0;right:0;bottom:0;border-radius:5px;background:var(--accent)}
.wk div.off i u{background:var(--ghost)}
.used{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.used a{color:var(--accent);font-weight:500;text-decoration:none}
.rad{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.rad .o{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ghost);margin-top:2px;flex-shrink:0}
.rad .o.on{border:5px solid var(--accent)}
.rad b{color:var(--ink);font-weight:500;display:block}.rad span{color:var(--muted);font-size:12.5px}
.src{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.inset{margin-top:12px;border:1px dashed var(--ghost);border-radius:12px;padding:8px 10px 6px;background:var(--sunken)}
.inset .il{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 4px 4px}
.tier .src2{margin-left:auto;font-size:12px;color:var(--muted)}.tier .src2 a{color:var(--accent);text-decoration:none;font-weight:500}
</style>
<script>
const KAMANA=['K','Kamana','#141414'];
const KO={role:'counsellor',ai:false,me:KAMANA,unread:0,on:'home'};
const OH={role:'owner',ai:true,me:MANISH,unread:0,on:'home'};
function row(o){return `<div class="it"><div class="ic ${o.tone||''}">${I(o.icon)}</div><div style="min-width:0"><div class="tl"><span class="nm">${o.n}</span>${o.chip||''}</div><div class="wh">${o.w}</div></div><div class="ac">${o.btn}</div></div>`;}
const C=(t,tone)=>`<span class="chip ${tone}">${t}</span>`;
const callBtn=`<span class="btn pri">${I('phone','s')}Call</span><span class="btn gh ico">${I('dots-three','s')}</span>`;
const openBtn=`<span class="btn">Open lead</span><span class="btn gh ico">${I('dots-three','s')}</span>`;

/* T1: counsellor Home */
const T1body=`<div class="home"><div class="top"><div><div class="h1">Good morning, Kamana</div><div class="lede">Sunday 8 November · 5 things to do · 0 booked today</div></div></div>
<div class="cols"><div>
<div class="sh"><h2>Do next</h2><span class="c">5</span><div class="r"><div class="seg"><div class="on">All <i>5</i></div><div>Calls <i>5</i></div></div></div></div>
<div class="tier"><span class="t">Now</span><span class="d">new leads to call, call-backs that are due</span><span class="src2">First calls count in working hours · <a>New lead process</a></span></div>
<div class="list">
${row({icon:'phone-incoming',tone:'bad',n:'Bikash Gurung',chip:C('Late · 1 h 5 min','bad'),w:'Website form · Canada · arrived Sat 8:10 pm (closed) · due Sun 10:00 am',btn:callBtn})}
${row({icon:'phone-incoming',tone:'bad',n:'Sneha Rai',chip:C('Late · 35 min','bad'),w:'Website form · Australia · arrived 9:30 am · due 10:30 am · no contact yet',btn:callBtn})}
${row({icon:'phone-incoming',tone:'new',n:'Arjun Thapa',chip:C('New · call by 11:52 am','new'),w:'Event page · UK · arrived 10:52 am · no contact yet',btn:callBtn})}
</div>
<div class="tier"><span class="t">Today</span><span class="d">booked call-backs, deadlines this week, tasks due</span></div>
<div class="list">
${row({icon:'phone-x',tone:'warn',n:'Sushil Sunar',chip:C('3 calls unanswered','warn'),w:'UK',btn:openBtn})}
${row({icon:'phone-x',tone:'warn',n:'Parash Kunwar',chip:C('3 calls unanswered','warn'),w:'USA',btn:openBtn})}
</div>
</div>
<div>
<div class="card"><div class="ch">${I('calendar-blank','s')}<h3>Today</h3><span class="r">Sun 8 Nov</span></div><div style="color:var(--muted);font-size:12.5px;padding:2px 0 6px">Nothing booked for today.</div></div>
<div class="card"><div class="ch">${I('pulse','s')}<h3>Your last 7 days</h3></div>
<div class="met"><span class="k">Calls made</span><span class="v">79</span><span class="u good">usual 36</span></div>
<div class="met"><span class="k">New leads called within 1 working hour</span><span class="v">0 of 3</span><span class="u">about your usual 0 of 9</span></div>
<div class="met"><span class="k">Moved forward</span><span class="v">4</span></div></div>
</div></div></div>`;

/* T2: owner Home, Needs you */
const T2body=`<div class="home"><div class="top"><div><div class="h1">Good morning, Manish</div><div class="lede">Sunday 8 November · <b>2 decisions</b> need you</div></div></div>
<div class="cols"><div>
<div class="sh"><h2>Needs you</h2><span class="c">2</span></div>
<div class="list">
${row({icon:'user-plus',tone:'bad',n:'Assign 3 new leads',chip:C('Waiting 12 min · target 5 min','bad'),w:'Suggested: <b>Kamana +2, Gautam +1</b> · they have the most room',btn:`<span class="btn pri">Assign as suggested</span><span class="btn">Choose…</span>`})}
${row({icon:'hourglass',tone:'warn',n:'551 call-backs over 2 weeks old',w:'Nobody will call these; clearing them keeps everyone’s list honest',btn:`<span class="btn">Clear them</span>`})}
</div>
<div class="inset"><div class="il">The same row before the target (under 5 working minutes)</div>
<div class="list">${row({icon:'user-plus',tone:'new',n:'Assign 3 new leads',chip:C('Waiting 3 min','new'),w:'Suggested: <b>Kamana +2, Gautam +1</b> · they have the most room',btn:`<span class="btn pri">Assign as suggested</span><span class="btn">Choose…</span>`})}</div>
<div style="font-size:12px;color:var(--muted);margin:6px 4px 2px">Minutes count in office hours (Sun–Fri, 9–6). A lead that arrives on Saturday starts waiting at 9:00 on Sunday. The 5 minutes come from "Assign within 5 min" in New lead → first call.</div></div>
</div>
<div>
<div class="card"><div class="ch">${I('tree-structure','s')}<h3>Rules from your processes</h3><span class="r">Open</span></div>
<div class="met"><span class="k">Assign within</span><span class="v" style="font-size:13px;font-weight:500">5 min · by hand</span></div>
<div class="met"><span class="k">First contact</span><span class="v" style="font-size:13px;font-weight:500">1 working hour</span></div>
<div class="met"><span class="k">Office hours</span><span class="v" style="font-size:13px;font-weight:500">Sun–Fri, 9–6</span></div>
<div style="font-size:12px;color:var(--muted);padding:6px 0 4px">From New lead → first call v2, approved by Manish on 7 Nov.</div></div>
</div></div></div>`;

/* Settings modal shell */
const NAV=[['building-office','General'],['sparkle','AI & Orca'],['building-office','Organization'],['users','Team & Roles'],['list-checks','Lead Management'],['calendar-dots','Leave'],['graduation-cap','Academic Operations'],['chat-text','Communications'],['lightning','Integrations'],['file-text','Compliance']];
const stg=(on,inner)=>`<div class="stg-scrim"></div><div class="stg"><div class="nav"><div class="who"><span class="lg">A</span><div><b>Admizz Education</b><span>Owner</span></div></div>${NAV.map(([ic,l])=>`<div class="nv${l===on?' on':''}">${I(ic,'m')}${l}</div>`).join('')}</div><div class="bdy"><span class="x">${I('x','m')}</span>${inner}</div></div>`;
const homeBg=`<div class="home"><div class="h1">Good morning, Manish</div></div>`;

/* T3: Organization → Office hours */
const wk=[['Sun',1533],['Mon',1264],['Tue',1613],['Wed',1513],['Thu',1548],['Fri',801],['Sat',11]];
const T3=stg('Organization',`<div class="sc"><h3>Office hours</h3><div class="sub">When your team takes calls. Processes count working time from these, so a lead that arrives while you're closed isn't counted late.</div>
<div class="lb">Working days</div><div class="days">${wk.map(([d])=>`<span class="${d==='Sat'?'':'on'}">${d}</span>`).join('')}</div>
<div class="lb">Hours</div><div class="tm"><span class="sel">9:00 am${I('caret-down','s')}</span><span style="color:var(--muted)">to</span><span class="sel">6:00 pm${I('caret-down','s')}</span><span style="color:var(--muted);font-size:12.5px;margin-left:8px">Asia/Kathmandu, from your workspace</span></div>
<div class="ev"><div class="hd">${I('pulse','s')}Set from your data · last 90 days</div>Your team logged <b>1,264 to 1,613 calls and notes on each day from Sunday to Thursday</b>, 801 on Fridays and <b>11 on Saturdays</b>. Most of the work happens between 9:30 am and 5:30 pm.
<div class="wk">${wk.map(([d,n])=>`<div class="${d==='Sat'?'off':''}"><i><u style="height:${Math.max(3,Math.round(n/1613*100))}%"></u></i>${d} · ${n.toLocaleString('en')}</div>`).join('')}</div></div>
<div class="used">${I('tree-structure','s')}Used by <a>New lead → first call v2</a> (first contact within 1 working hour, assign within 5 minutes)</div>
<div style="display:flex;gap:8px;margin-top:16px"><span class="btn pri">Save</span><span style="font-size:12px;color:var(--muted);align-self:center">Changes are logged in EdgeX improvements.</span></div></div>
<div class="sc" style="opacity:.55"><h3>Manage Partner Colleges</h3><div class="sub">Add and manage partner colleges that appear in your lead forms. 13 active, 13 total</div></div>`);

/* T4: Lead Management → Smart assignment */
const T4=stg('Lead Management',`<div class="sc" style="max-width:820px"><h3>Smart assignment</h3><div class="sub">Picks who should take each new lead, with a reason you can read. Rules over your own data, no AI.</div>
<div style="margin-top:12px"><div class="rad"><span class="o on"></span><div><b>Off</b><span>New leads wait for a manager, as today.</span></div></div>
<div class="rad"><span class="o"></span><div><b>Shadow</b><span>It picks someone for every new lead but assigns nothing. Your home shows how often your managers agree.</span></div></div>
<div class="rad"><span class="o"></span><div><b>Auto</b><span>It assigns each new lead the moment it arrives, tells the person, and shows you an FYI with Undo.</span></div></div></div>
<div style="margin-top:6px"><span class="btn" style="opacity:.5">Save</span></div>
<div class="sc" style="margin-top:16px;padding:16px 18px"><h3 style="font-size:14px">Who takes new leads</h3>
<div class="src">${C('Counselor','')}${C('Lead Executive','')}<span style="font-size:12.5px;color:var(--muted)">from <a style="color:var(--accent);font-weight:500">New lead → first call v2</a>, step <b style="color:var(--ink);font-weight:500">First contact</b></span></div>
<div style="font-size:12.5px;color:var(--text);margin-top:10px">To change who takes new leads, suggest a change to that step. Once the process owner approves it, smart assignment follows.</div>
<div style="margin-top:10px;display:flex;gap:8px"><span class="btn">${I('pencil-simple','s')}Suggest a change</span></div>
<div class="ev" style="margin-top:12px"><div class="hd">${I('pulse','s')}Last 60 days</div>Your new leads went to Counselor (368), Lead Executive (95), Application Executive (59), Branch Manager (24) and Admin (13).</div></div>
<div class="sc" style="margin-top:16px;padding:16px 18px;opacity:.55"><h3 style="font-size:14px">How it picks</h3><div class="sub">Who can get a lead: active people in these positions, not on approved leave today …</div></div></div>`);

document.getElementById('scenes').innerHTML+=
`<section class="scene" id="t1"><div class="scene-h"><b>T1 · Phase 3: a counsellor's Home follows the live process</b><span>New lead → first call v2 says "within 1 working hour", so each new lead has a real deadline in office hours. Before it: blue "call by". After it: red "Late". A Saturday lead's clock starts at 9:00 on Sunday. Sunday 8 Nov, 11:05 am.</span></div>${app(KO,T1body)}</section>`+
`<section class="scene" id="t2"><div class="scene-h"><b>T2 · Phase 3: the owner's "Assign new leads" uses the process's 5 minutes</b><span>The row turns red only after the assign target, counted in office hours. A small card shows the rules Home is running and where they come from.</span></div>${app(OH,T2body)}</section>`+
`<section class="scene" id="t3"><div class="scene-h"><b>T3 · Phase 3: Settings → Organization → Office hours</b><span>Filled in from the team's own data (Admizz: Sunday to Friday, closed Saturday). Every working-hour rule and measure reads this. Owners and admins edit it; each change is logged.</span></div>${app(OH,homeBg,T3)}</section>`+
`<section class="scene" id="t4"><div class="scene-h"><b>T4 · Phase 3: smart assignment takes "who" from the process</b><span>The positions now come from the First contact step of the live process. To change them, suggest a change and the owner approves it. Off / Shadow / Auto stays here for now.</span></div>${app(OH,homeBg,T4)}</section>`;
</script>
</body></html>
