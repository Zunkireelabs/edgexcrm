<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Applications phone v1</title>
<style>
:root{
  --canvas:#f6f6f5;--surface:#fff;--sunken:#fafaf9;--hover:#f6f7f9;--selected:#efefee;
  --border:#e8e9eb;--divider:#f0f1f2;--ink:#101112;--text:#2b2d2f;--muted:#6b6f76;--faint:#9a9ea5;--ghost:#d0d3d7;
  --accent:#2272B4;--accent-soft:#eaf2fa;--good:#127a4a;--good-soft:#e9f6ef;--bad:#b42318;--bad-soft:#fdeeec;
  --warn:#a15c07;--warn-soft:#fdf3e3;--col:#fbfbfb;--ring:0 0 0 1px rgba(0,0,0,.06);
  --float:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1);
}
*{box-sizing:border-box}
body{margin:0;background:#e9e9e7;font:13px/1.4 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit}
.mk{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 16px;background:#101112;color:#cfd2d6;font-size:12px}
.mk b{color:#fff;margin-right:6px}
.mk button{background:transparent;border:1px solid #3a3d42;color:#cfd2d6;border-radius:6px;height:24px;padding:0 9px;cursor:pointer}
.mk button.on{background:#fff;color:#101112;border-color:#fff}
.stage{display:flex;gap:32px;padding:24px 32px;align-items:flex-start}
/* phone */
.phone{width:390px;height:844px;flex:none;background:var(--canvas);border-radius:40px;box-shadow:0 0 0 10px #1b1c1e,0 20px 40px rgba(0,0,0,.25);overflow:hidden;position:relative;display:flex;flex-direction:column;margin:10px}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-weight:600;font-size:14px;color:var(--ink)}
.top{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px}
.top .sq{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.top .av{width:22px;height:22px;border-radius:9999px;background:#101112;color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.sp{flex:1}
.frame{flex:1;min-height:0;background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;position:relative}
/* header */
.head{display:flex;align-items:center;gap:8px;padding:14px 16px 0;height:50px}
.head h1{margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600;color:var(--ink)}
.cnt{font-size:12px;color:var(--muted);background:var(--hover);border-radius:9999px;padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:500;white-space:nowrap}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.pipe{max-width:176px}.pipe .nm{overflow:hidden;text-overflow:ellipsis}
.pipe .pi{width:18px;height:18px;border-radius:5px;background:#fff1e6;color:#c2561a;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pipe .pi svg{width:12px;height:12px}
/* tabs */
.tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 16px 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex:none}
.tab{padding:7px 8px 9px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab .n{font-size:11px;background:var(--hover);color:var(--muted);border-radius:9999px;padding:0 6px;font-weight:600}
.tab .n.red{background:var(--bad-soft);color:var(--bad)}
/* toolbar */
.bar1{display:flex;gap:8px;padding:10px 16px 0;flex:none}
.search{flex:1;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;color:var(--faint);font-size:14px}
.seg{display:inline-flex;background:var(--hover);border-radius:10px;padding:2px;gap:2px;flex:none;margin:0 0 5px auto}
.seg button{height:28px;width:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),var(--ring)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 16px 8px;flex:none;border-bottom:1px solid var(--border)}
.bar2{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent)}
.chip.srch{width:32px;padding:0;justify-content:center;border:1px solid var(--border);background:#fff;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px dashed var(--ghost);color:var(--muted);font-weight:500;white-space:nowrap;flex:none}
.chip.on{border:1px solid var(--border);background:var(--sunken);color:var(--ink)}
.chip.sort{border:1px solid var(--border);background:#fff;color:var(--muted)}
.chip.sort b{color:var(--ink);font-weight:500}
.chip b{font-weight:600}.chip .op{color:var(--muted);font-weight:400}.chip .x{color:var(--faint);margin-left:2px}
.chip.plus{width:32px;padding:0;justify-content:center}
/* note */
.note{display:flex;align-items:center;gap:8px;margin:8px 16px 0;padding:0 10px;height:30px;border-radius:8px;background:var(--sunken);box-shadow:var(--ring);color:var(--muted);font-size:12px;flex:none;white-space:nowrap}
.note b{color:var(--ink);font-weight:600}.note span{overflow:hidden;text-overflow:ellipsis}.note a{color:var(--accent);font-weight:500;margin-left:auto;text-decoration:none;flex:none}
/* stage strip */
.strip{display:flex;gap:6px;padding:10px 16px 8px;overflow-x:auto;scrollbar-width:none;flex:none;align-items:center}
.sp1{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9999px;color:var(--muted);font-weight:500;white-space:nowrap;flex:none;background:var(--hover)}
.sp1 .dot{width:8px;height:8px;border-radius:9999px}
.sp1 .c{font-variant-numeric:tabular-nums;color:var(--faint);font-weight:500}
.sp1.on{background:var(--ink);color:#fff}.sp1.on .c{color:rgba(255,255,255,.7)}
.sp1.fin{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
.sp1.fin.on{background:var(--ink);box-shadow:none}
.stripsep{display:inline-flex;align-items:center;gap:6px;color:var(--faint);font-size:11px;flex:none;padding:0 2px 0 4px}
.stripsep::before{content:"";width:1px;height:18px;background:var(--border)}
/* board */
.board{flex:1;min-height:0;display:flex;gap:8px;padding:0 16px 0;overflow:hidden}
.col{width:326px;flex:none;background:var(--col);border-radius:16px 16px 0 0;display:flex;flex-direction:column;min-height:0}
.col.peek{width:326px;opacity:1}
.cards{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.newrow{height:36px;border-radius:9px;border:1px dashed rgba(0,0,0,.06);background:rgba(0,0,0,.02);color:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:6px;flex:none;font-weight:500}
.newrow svg{width:13px;height:13px}
.card{background:#fff;border-radius:12px;box-shadow:var(--ring);flex:none;position:relative}
.card.lift{box-shadow:0 0 0 2px var(--accent),var(--float)}
.ct{display:flex;align-items:center;gap:8px;padding:10px 4px 6px 12px}
.uni{width:20px;height:20px;border-radius:6px;background:var(--hover);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.uni svg{width:12px;height:12px}
.ct .t{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.kb{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);flex:none;margin:-6px 0}
.f{display:flex;align-items:center;gap:8px;padding:3px 12px;font-size:13px;color:var(--text);min-width:0}
.f .i{width:14px;height:14px;color:var(--faint)}
.f span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .set{color:rgba(0,0,0,.42)}.f .sub{color:var(--muted)}
.av{width:18px;height:18px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex:none}
.offer{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:500;margin:4px 0 0 12px}
.offer.cond{background:var(--warn-soft);color:var(--warn)}
.cfoot{display:flex;align-items:center;gap:12px;padding:8px 10px 9px 12px;margin-top:6px;color:var(--faint);font-size:12px}
.cfoot .m{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.cfoot .m svg{width:13px;height:13px}.cfoot .m.miss{color:var(--warn)}
.age{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:500;color:rgba(0,0,0,.63);font-variant-numeric:tabular-nums;flex:none}
.age svg{width:12px;height:12px}.age.amber{background:var(--warn-soft);color:var(--warn)}.age.red{background:var(--bad-soft);color:var(--bad)}
.more{height:36px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-weight:500;flex:none}
/* list */
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.lr{flex:none;display:flex;flex-direction:column;gap:3px;padding:10px 16px;border-bottom:1px solid var(--divider);min-height:72px;justify-content:center}
.lr .l1{display:flex;align-items:center;gap:8px}
.lr .nm{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.lr .l2{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .l3{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12.5px;min-width:0}
.lr .l3 .dot{width:8px;height:8px;border-radius:9999px;flex:none}
.lr .l3 .sg{white-space:nowrap}
.lr .l3 .dl{color:var(--faint)}
.lr .l3 .co{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap;min-width:0}
.lr .l3 .co span{overflow:hidden;text-overflow:ellipsis}
.dlw{color:var(--warn)!important}
.pager{position:sticky;bottom:0;margin-top:auto;display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-top:1px solid var(--border);color:var(--muted);flex:none;font-variant-numeric:tabular-nums;background:#fff}
.pager b{color:var(--ink);font-weight:500}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(16,17,18,.32);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:var(--float),var(--ring);z-index:41;display:flex;flex-direction:column;max-height:78%;padding-bottom:22px}
.grab{width:36px;height:4px;border-radius:9999px;background:var(--ghost);margin:8px auto 4px;flex:none}
.sh{display:flex;align-items:center;gap:8px;padding:6px 8px 8px 16px;flex:none}
.sh h2{margin:0;font-size:16px;font-weight:600;color:var(--ink)}
.sh .sub{color:var(--muted);font-size:12px}
.sbody{overflow:auto;padding:0 8px}
.mi{height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:10px;color:var(--text);font-size:14px}
.mi.hl{background:var(--hover);color:var(--ink)}
.mi .r{margin-left:auto;color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.mi .dot{width:9px;height:9px;border-radius:9999px;flex:none}
.mi .ck{color:var(--accent);margin-left:auto}
.mi .i{color:var(--muted)}
.lbl{font-size:11px;color:var(--faint);padding:10px 10px 4px}
.ssearch{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;margin:0 8px 6px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border);color:var(--faint);font-size:14px;flex:none}
.pmrow{display:flex;gap:10px;padding:10px;border-radius:10px}
.pmrow.hl{background:var(--hover)}
.pmrow .t{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;font-size:14px}
.pmrow .badge{font-size:11px;font-weight:500;color:var(--muted);background:var(--hover);box-shadow:inset 0 0 0 1px var(--border);border-radius:5px;padding:0 5px;height:18px;display:inline-flex;align-items:center}
.pmrow .meta{color:var(--muted);font-size:12px;margin-top:1px}
.pmrow .sbar{display:flex;height:4px;border-radius:9999px;overflow:hidden;background:var(--divider);margin-top:7px;gap:1px}
.pmrow .sbar i{display:block;height:100%}
.pmrow .ck{width:16px;height:16px;color:var(--accent);margin-top:2px}.pmrow .ck.off{color:transparent}
/* empty */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 24px 0}
.ill{width:96px;height:96px;border-radius:18px;background:radial-gradient(circle,#e7e8ea 1px,transparent 1.2px) 0 0/10px 10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ill .doc{width:58px;height:68px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px #e3e4e7,0 2px 6px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px;padding:11px 10px}
.ill .doc i{display:block;height:5px;border-radius:3px;background:#e6e7ea}
.empty h3{margin:0 0 4px;font-size:17px;color:var(--ink);font-weight:600}
.empty p{margin:0 0 16px;color:var(--muted);max-width:280px}
.toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:45;background:#101112;color:#fff;border-radius:12px;height:44px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;font-size:13px}
.toast a{margin-left:auto;color:#9cc7ef;font-weight:500;padding:0 8px}
/* notes panel */
.notes{max-width:520px;font-size:13px;line-height:1.55;color:var(--text)}
.notes h2{font-size:16px;margin:4px 0 8px;color:var(--ink)}
.notes h3{font-size:13px;margin:16px 0 4px;color:var(--ink)}
.notes ul{margin:0;padding-left:18px}.notes li{margin:3px 0}
.notes code{background:#fff;border-radius:4px;padding:0 4px;box-shadow:var(--ring);font-size:12px}
.notes .st{background:#fffbe6;border:1px solid #f0d77a;color:#5c4a00;border-radius:10px;padding:10px 12px}
</style></head><body>
<div class="mk"><b>Mockup · Applications phone v1 (Phase 5, &lt;768px)</b>
  <button data-s="board" class="on">1 Board</button>
  <button data-s="filtered">2 Filtered</button>
  <button data-s="move">3 Move card</button>
  <button data-s="filter">4 Filter sheet</button>
  <button data-s="finished">5 Finished stage</button>
  <button data-s="list">6 List</button>
  <button data-s="pipe">7 Pipeline sheet</button>
  <button data-s="nores">8 No results</button>
</div>
<div class="stage">
  <div class="phone" id="phone"></div>
  <div class="notes" id="notes"></div>
</div>
<script>
const I={plus:'<path d="M12 5v14M5 12h14"/>',dots:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
uni:'<path d="M3 10 12 5l9 5-9 5-9-5z"/><path d="M7 12v4c3 2 7 2 10 0v-4"/>',book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
task:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m9 12 2 2 4-4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',sort:'<path d="M3 6h13M3 12h9M3 18h5M18 8v12m0 0-3-3m3 3 3-3"/>',
filt:'<path d="M4 6h16M7 12h10M10 18h4"/>',board:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',
lst:'<path d="M4 6h16M4 12h16M4 18h16"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
chev:'<path d="m6 9 6 6 6-6"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',check:'<path d="m5 12 5 5 9-10"/>',
x:'<path d="M6 6l12 12M18 6 6 18"/>',hash:'<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>',dead:'<path d="M12 3v3M5 6l2 2M19 6l-2 2"/><circle cx="12" cy="14" r="7"/><path d="M12 11v3"/>',
coin:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>',

const ic=(k,st='')=>`<svg class="i" viewBox="0 0 24 24"${st?` style="${st}"`:''}>${I[k]}</svg>`;
const CO={AT:{n:'Asha Tamang',bg:'#e8f1fb',c:'#1f5d94'},BR:{n:'Binod Rai',bg:'#efeafc',c:'#5b47d6'},GK:{n:'Gita Karki',bg:'#e9f6ef',c:'#127a4a'},ET:{n:'Esha Thapa',bg:'#fdf3e3',c:'#a15c07'},BD:{n:'Bijay Dahal',bg:'#fdeeec',c:'#b42318'}};
const ACTIVE=[{k:'nts',n:'Need to start',c:'#9aa4b2',count:6},{k:'sl',n:'Shortlisted',c:'#3b82f6',count:9},{k:'dp',n:'Documents pending',c:'#f97316',count:14},{k:'ap',n:'Applied',c:'#a855f7',count:21},{k:'co',n:'Conditional offer',c:'#eab308',count:18},{k:'uo',n:'Unconditional offer',c:'#14b8a6',count:11},{k:'dep',n:'Deposit paid',c:'#0ea5e9',count:7},{k:'vl',n:'Visa lodged',c:'#6366f1',count:12},{k:'va',n:'Visa approved',c:'#22c55e',count:23}];
const DONE=[{k:'en',n:'Enrolled',c:'#16a34a',count:15},{k:'rj',n:'Rejected',c:'#ef4444',count:2},{k:'wd',n:'Withdrawn',c:'#6b7280',count:63}];
const CARDS=[
 {u:'University of East London',p:'MSc Data Science',s:'Sita Gurung',ck:'AT',in:'Sep 2026',ct:'United Kingdom',d:[5,5],t:1,a:6},
 {u:'Deakin University',p:'Master of IT',s:'Rohan Adhikari',ck:'BR',in:'Feb 2027',ct:'Australia',d:[1,6],t:2,a:17},

 {u:'Monash University',p:'Bachelor of Commerce',s:'Kiran Bhandari',ck:'GK',in:'Jul 2026',ct:'Australia',d:[2,5],t:1,a:44}];
function card(c,o={}){const co=c.ck&&CO[c.ck];const ac=o.term?'':(c.a>=30?'red':c.a>=14?'amber':'');
 return `<div class="card ${o.lift?'lift':''}"><div class="ct"><span class="uni">${ic('uni')}</span><span class="t">${c.u}</span>${o.admin!==false?`<span class="kb" title="Move to stage">${ic('dots')}</span>`:''}</div>
 <div class="f">${ic('book')}<span class="sub">${c.p}</span></div><div class="f">${ic('user')}<span>${c.s}</span></div>

const N={
board:`<h2>1 · Board, one stage at a time</h2><ul>
<li><b>Breakpoint:</b> below <code>md</code> (768px), the same one the shell uses for its drawer. Desktop layout is untouched at 768px and up.</li>
<li><b>Header:</b> title, pipeline button (max 176px, name truncates, its count drops), the header count pill is dropped on phone because the All tab already carries the (filtered) count, and a 32px ink "+" (Add application). The gear is hidden on phone (Pipeline settings is a desktop task).</li>
<li><b>Tabs</b> shorten to All / Mine / Stuck 30d+, one line, scroll sideways if needed. Today they wrap to two lines.</li>
<li><b>Toolbar = one row:</b> a full-width sideways-scrolling chip row (search icon, Sort, active filters, Filter; right edge fades). The Board/List icon toggle moves up to the right end of the tabs row, where there is spare room. Tapping the search icon turns the row into a full-width 36px input with Cancel; the query lives in <code>?q=</code> as on desktop, and while a query is set the icon shows it as a chip ("“sita” ×"). Width toggle hidden.</li>
<li><b>Note</b> becomes one 32px line.</li>
<li><b>Stage strip</b> (new): every stage as a pill with its count, ink pill = the stage on screen; Finished stages after a divider. Tap a pill to jump; swiping the column moves the pill and scrolls it into view. Opens on the first stage that has applications.</li>
<li><b>Scrolling:</b> the frame is the one vertical scroller. Header, tabs and toolbar scroll away; the strip sticks to the top, so a long column gets almost the full screen. Switching stage resets the scroll to just under the strip.</li>
<li><b>One column</b> 326px wide (screen − 64), scroll-snap, the next column peeks 8px + gap so swipe is discoverable. Column header is dropped (the strip is the header). Cards are the desktop card at full width; "Show N more" and the 25/column paging unchanged.</li>
<li>Touch targets ≥ 32px everywhere, 44px rows in sheets.</li></ul>`,
filtered:`<h2>2 · Filtered</h2><ul><li>Active chips sit in the scrolling chip row; the "Filter" chip collapses to a dashed "+" square once any chip exists (same as desktop).</li><li>Chip labels shorten names ("Asha T.") only when the chip is wider than 180px; the full value is in the edit sheet.</li><li>Tab counts read the filtered numbers (All 20) as on desktop; the strip counts follow the filters (same server counts as desktop). Stages with 0 stay in the strip, muted counts.</li><li>The note hides while filtered (same as desktop).</li></ul>`,
move:`<h2>3 · Move card (replaces drag on phone)</h2><ul><li><b>No drag on touch.</b> Dragging inside a horizontal swipe fights the scroll and is error-prone one-handed. Every card shows a 32px "⋯" for admins (<code>canManageApplications</code>); tap it, or long-press the card (500ms), to open this sheet.</li><li>The sheet is Phase 4's "Move to stage…" picker as a bottom sheet: active stages, then a Finished group; current stage ticked; 44px rows. It calls the same PATCH.</li><li>On success: the card leaves the column, strip counts update, toast "Moved to Applied · Undo" (Undo = PATCH back). Failure = toast error, card stays.</li><li>Read-only users: no "⋯", long-press does nothing. Tap always opens the detail.</li><li>Desktop drag is untouched.</li></ul>`,
filter:`<h2>4 · Filter sheet</h2><ul><li>Every popover from the desktop toolbar opens as a bottom sheet on phone: Filter, Sort, a chip's edit, Pipeline. Same content and code paths, only the container changes (Radix Popover → sheet below md).</li><li>Picking a field slides to its values in the same sheet with a back arrow; Apply is immediate, like desktop.</li><li>Sheet: r16 top corners, grab handle, 44px rows, max 78% height, closes on scrim tap or swipe down.</li></ul>`,
finished:`<h2>5 · Finished stage</h2><ul><li>Finished stages are pills after the divider (outlined, not filled). No collapsed slim columns on phone: tapping a Finished pill opens that column like any other; it lazy-loads as on desktop.</li><li>No age pills on finished cards (same rule as desktop).</li><li>No "New application" row in finished stages.</li></ul>`,
list:`<h2>6 · List, as stacked rows</h2><ul><li>The table doesn't fit 390px, so below md the List renders <b>rows, not a table</b>: line 1 student + age pill, line 2 university · program, line 3 stage dot + name + deadline (amber ≤14d, red past), counsellor avatar right.</li><li>72px rows, tap opens <code>/applications/&lt;id&gt;?back=…</code>.</li><li>No checkboxes, bulk bar, column menu or View settings on phone (admin bulk stays a desktop task).</li><li>Same server paging: pager "1–25 of 201" with prev/next, page size = the user's stored size; the size picker and footer summaries are hidden.</li><li>Sort/filter come from the same chip row.</li></ul>`,
pipe:`<h2>7 · Pipeline sheet</h2><ul><li>The desktop pipeline menu as a sheet: search, rows with count + stage bar, check on current. No hover gear (no Pipeline settings on phone). "New pipeline" hidden on phone.</li></ul>`,
nores:`<h2>8 · No results</h2><ul><li>The Phase 2 no-matches state, smaller (96px art), centred under the toolbar instead of over the board; the strip hides when the filter returns 0 everywhere.</li><li>Empty pipeline uses the same layout with its own copy and "Add application".</li></ul>`};

 },

 const st=k=>ACTIVE.find(s=>s.k===k);

 <div class="l3"><span class="dot" style="background:${st(r[3]).c}"></span><span class="sg">${st(r[3]).n}</span>${r[6]!=='—'?`<span class="dl ${r[7]==='w'?'dlw':''}" ${r[7]==='r'?'style="color:var(--bad)"':''}>· ${r[6]}</span>`:''}
 <span class="co">${co?`<span class="av" style="background:${co.bg};color:${co.c}">${r[5]}</span><span>${co.n}</span>`:'<span style="color:rgba(0,0,0,.42)">Set counsellor</span>'}</span></div></div>`;}).join('')}
 <div class="pager"><span><b>1–25</b> of 201</span><span class="sp"></span><span class="btn icon" style="opacity:.45">${ic('left')}</span><span class="btn icon">${ic('right')}</span></div></div></div>`;},
