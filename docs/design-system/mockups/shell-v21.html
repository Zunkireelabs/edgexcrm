<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sidebar v2.1 – EDGEX-86 mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#f6f6f5; --surface:#fff; --sunken:#fafaf9; --hover:#ececeb; --selected:#e9e9e7;
  --border:#e8e8e6; --divider:#f0f0ee;
  --ink:#141414; --text:#3a3a38; --muted:#73736f; --faint:#a3a39e; --ghost:#d6d6d2;
  --accent:#2272B4; --ai:#5b47d6; --ai-line:#d9d3fa;
  --ai-grad:linear-gradient(135deg,#2272B4 0%,#7c5cf0 100%);
  --shadow-float:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#e4e4e2;color:var(--text);font-size:13px;line-height:1.5;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;padding:1px 0}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.s{width:14px;height:14px}
.scene{margin:28px auto;width:1440px;background:var(--canvas);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.scene-h{background:#141414;color:#fff;padding:10px 18px;font-size:12px}.scene-h b{margin-right:10px;font-weight:600}.scene-h span{color:#a3a3a3}
.app{display:flex;min-height:900px;position:relative}
/* sidebar */
.side{width:232px;padding:10px 10px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:1px}
.org{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 8px 0 8px;margin-top:-10px}
.org b{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}.org i{font-style:normal;color:var(--accent)}
.org svg{color:var(--faint)}
.mode{display:flex;background:var(--sunken);border:1px solid var(--border);border-radius:10px;padding:2px;margin:2px 0 8px}
.mode div{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:26px;border-radius:8px;color:var(--muted);font-weight:500;font-size:12.5px}
.mode .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.srch{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;margin:2px 0 10px}
.srch svg{color:var(--faint)}
.srch kbd{margin-left:auto;font:500 11px Inter;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px;height:18px;display:grid;place-items:center;background:var(--sunken)}
.ng{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px;color:var(--faint);font-size:12px;font-weight:500}
.ng svg{color:var(--ghost)}
.ng.shut svg{transform:rotate(-90deg)}
.ni{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;color:var(--text);font-size:13.5px;white-space:nowrap}
.ni svg{color:var(--muted)}
.ni.on{background:var(--selected);color:var(--ink);font-weight:500}.ni.on svg{color:var(--ink);stroke-width:1.75}
svg.p{width:18px;height:18px;margin:0 -1px;fill:currentColor;stroke:none;flex-shrink:0}
.duo{display:flex;gap:0}.duo>div{flex:1;border-right:1px solid var(--border)}.duo .cap{padding:12px 16px 0;font-weight:600;color:var(--ink);font-size:13px}.duo .cap span{font-weight:400;color:var(--muted);margin-left:6px}
.ni .b{margin-left:auto;font-size:11.5px;color:var(--muted)}
.ni .cv{margin-left:auto;color:var(--ghost);display:flex}
.ni.open .cv svg{transform:rotate(180deg)}
.sub2{margin:1px 0 4px 15px;padding-left:12px;border-left:1px solid var(--border)}
.sub2 .ni{height:28px;font-size:13px;color:var(--muted)}
.sub2 .ni.on{color:var(--ink)}
.sub2 .ni.mg{color:var(--faint);font-size:12.5px}
.side .grow{flex:1;min-height:16px}
.foot{border-top:1px solid var(--border);margin:6px -10px 0;padding:8px 10px 0;display:flex;flex-direction:column;gap:1px}
/* rail */
.fly{position:absolute;left:64px;width:200px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-float);padding:6px;z-index:9}
.fly .t{color:var(--faint);font-size:12px;font-weight:500;padding:4px 8px 6px}
.fly .ni{height:30px;font-size:13px}
.rail .ni.flyon{background:var(--hover);color:var(--ink)}
.side.rail{width:60px;padding:10px 8px;align-items:center}
.rail .org{padding:0;justify-content:center;width:100%}
.rail .ni{width:40px;height:34px;justify-content:center;padding:0}
.rail .srch{width:40px;height:32px;padding:0;justify-content:center}
.rail .sep{width:24px;height:1px;background:var(--border);margin:7px 0}
/* right column */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hdr{height:44px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 8px 0 12px}
.hb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:500;font-size:12.5px;white-space:nowrap}
.hb svg{color:var(--muted)}
.hb.icon{width:30px;padding:0;justify-content:center}
.hb .dot{position:absolute;margin:-12px 0 0 12px;width:7px;height:7px;border-radius:50%;background:var(--ink);border:1.5px solid var(--surface)}
.hb.orca{border-color:var(--ai-line)}.hb.orca svg{color:var(--ai)}
.hb.me{padding:0 8px 0 2px;gap:6px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:600;flex-shrink:0}
.frame{flex:1;margin:0 8px 8px 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;min-width:0}
.body{padding:28px 32px 40px}
.h1{font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.lede{color:var(--muted);font-size:14px;margin-top:4px}.lede b{color:var(--ink);font-weight:500}
.ph{border:1px dashed var(--ghost);border-radius:12px;display:grid;place-items:center;color:var(--faint);font-size:12.5px;margin-top:24px}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--border);border-radius:10px;padding:2px}
.seg div{padding:5px 11px;border-radius:8px;color:var(--muted);font-weight:500;font-size:12.5px}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:500;font-size:12.5px}
.row{display:flex;align-items:center}
/* avatar menu */
.menu{position:absolute;right:8px;top:42px;width:272px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-float);padding:6px;z-index:9}
.menu .who{display:flex;gap:10px;align-items:center;padding:8px}
.menu .who .av{width:32px;height:32px;font-size:11.5px}
.menu .nm{color:var(--ink);font-weight:500;font-size:13.5px}.menu .em{color:var(--muted);font-size:12.5px}
.menu .role{display:inline-flex;margin:0 8px 8px;padding:1px 8px;border-radius:8px;border:1px solid var(--border);background:var(--sunken);font-size:12px;color:var(--text)}
.menu hr{border:0;border-top:1px solid var(--divider);margin:4px -6px}
.menu .lab{color:var(--faint);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:8px 8px 2px}
.menu .ws{padding:2px 8px 8px}.menu .ws b{display:block;color:var(--ink);font-weight:500;font-size:13.5px}.menu .ws span{color:var(--muted);font-size:12.5px}
.menu .mi{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;color:var(--text);font-size:13.5px}
.menu .mi svg{color:var(--muted)}
.menu .mi.hov{background:var(--hover)}

/* v2.1 menu */
.menu{width:304px;max-height:calc(100% - 52px);overflow-y:auto}
.menu .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .role{max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;width:max-content}
.card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:6px 2px;background:var(--surface)}
.card .ch{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:13px}
.card .ch .r{margin-left:auto}
.prev{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;border:1px solid var(--ai-line);color:var(--ai);font-size:10.5px;font-weight:500;background:var(--surface)}
.soon{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;background:var(--sunken);border:1px solid var(--border);color:var(--faint);font-size:10.5px;font-weight:500}
.kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}.kv b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--divider);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.bar.ai i{background:var(--ai-grad)}
.ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--divider);flex-shrink:0}
.ring.ai{border-color:#d9d3fa;border-top-color:#7c5cf0}
.note2{font-size:12px;color:var(--muted);margin-top:4px}
.ghostbtn{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--border);color:var(--faint);font-size:12px;font-weight:500;background:var(--sunken)}
.menu .mi .k{margin-left:auto;font:500 11px Inter;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px;background:var(--sunken)}
.menu .mi.off{color:var(--faint)}.menu .mi.off svg{color:var(--ghost)}.menu .mi .soon{margin-left:auto}
.hb.me .nm2{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bn{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg{position:relative;display:inline-grid;place-items:center;flex-shrink:0}
.rg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.rg .pc{font-size:10.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
/* pins */
.pin{position:absolute;width:18px;height:18px;border-radius:50%;background:#e8590c;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;z-index:12}
.legend{padding:18px 22px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 28px;border-top:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text)}
.legend div b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#e8590c;color:#fff;font-size:10.5px;margin-right:8px}
/* phone */
.phone{width:390px;height:780px;border:10px solid #141414;border-radius:36px;overflow:hidden;position:relative;background:var(--canvas)}
.phone .ph-hdr{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px}
.phone .scrim{position:absolute;inset:0;background:rgba(20,20,20,.45)}
.phone .side{position:absolute;left:0;top:0;bottom:0;background:var(--canvas);width:280px;box-shadow:var(--shadow-float)}
/* icon sheet */
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:22px;background:var(--surface)}
.ic{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--divider);font-size:13px}
.ic .old,.ic .new{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.ic .old{background:var(--sunken);color:var(--faint)}.ic .new{background:var(--selected);color:var(--ink)}
.ic .ar{color:var(--ghost)}
.ic .t{color:var(--ink);font-weight:500}.ic .why{color:var(--muted);font-size:12px}
</style></head><body>
