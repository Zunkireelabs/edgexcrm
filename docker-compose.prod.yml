services:
  app:
    image: ghcr.io/zunkireelabs/edgexcrm:prod
    container_name: leads-crm
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g          # keep swap disabled — swapping a Node heap is worse than dying
    env_file:
      - .env.local
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
      # Production is the ONE environment that reaches the real Resend API (F3,
      # docs/BLAST-FINDINGS-2026-09-06.md). Declared explicitly here rather than inferred
      # from NODE_ENV, because the same image sets NODE_ENV=production on stage too.
      - EMAIL_TRANSPORT=resend
    networks:
      - hosting
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      - "autoheal=true"

      # HTTPS
      - "traefik.http.routers.leads-crm-secure.entrypoints=websecure"
      - "traefik.http.routers.leads-crm-secure.rule=Host(`edgex.zunkireelabs.com`) || Host(`lead-crm.zunkireelabs.com`)"
      - "traefik.http.routers.leads-crm-secure.tls=true"
      - "traefik.http.routers.leads-crm-secure.tls.certresolver=letsencrypt"

      # HTTP redirect
      - "traefik.http.routers.leads-crm.entrypoints=web"
      - "traefik.http.routers.leads-crm.rule=Host(`edgex.zunkireelabs.com`) || Host(`lead-crm.zunkireelabs.com`)"
      - "traefik.http.middlewares.leads-crm-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.leads-crm.middlewares=leads-crm-redirect"

      # Service
      - "traefik.http.services.leads-crm.loadbalancer.server.port=3000"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  hosting:
    external: true
