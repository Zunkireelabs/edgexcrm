name: Deploy to Staging

on:
  push:
    branches: [stage]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zunkireelabs/edgexcrm

jobs:
  checks:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint --max-warnings 50
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: checks
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:stage
            ${{ env.IMAGE }}:stage-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply Pending Migrations
    runs-on: ubuntu-latest
    needs: build-push
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply pending migrations
        env:
          STAGE_DB_URL: ${{ secrets.STAGE_DB_URL }}
        run: scripts/migrate-apply.sh stage

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-push, migrate]
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          AI_TOOL_APPROVAL_SECRET: ${{ secrets.AI_TOOL_APPROVAL_SECRET }}
          RESEND_INBOUND_WEBHOOK_SECRET: ${{ secrets.RESEND_INBOUND_WEBHOOK_SECRET }}
          INBOUND_TOKEN_SECRET: ${{ secrets.INBOUND_TOKEN_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: GHCR_USER,GHCR_TOKEN,OPENAI_API_KEY,INNGEST_EVENT_KEY,INNGEST_SIGNING_KEY,LANGFUSE_PUBLIC_KEY,LANGFUSE_SECRET_KEY,AI_TOOL_APPROVAL_SECRET,RESEND_INBOUND_WEBHOOK_SECRET,INBOUND_TOKEN_SECRET,NEXTAUTH_SECRET
          script: |
            set -e
            cd /home/zunkireelabs/devprojects/lead-gen-crm-dev
            git pull origin stage
            # Auth env — idempotent managed block (PROD-HARDENING BRIEF §1.3).
            # NEXTAUTH_SECRET signs the Gmail inbox-connect OAuth CSRF state
            # (src/lib/email/oauth-state.ts); it previously lived only as a
            # hand-added .env.local line, which does not survive a box rebuild.
            # This GitHub-managed value wins over any hand-added line further up
            # the file (last assignment wins) — once this is set, remove the
            # hand-added line as a follow-up (harmless duplicate until then).
            # Prod and stage MUST use different values.
            sed -i '/^# --- BEGIN AUTH env (managed by GitHub Actions) ---$/,/^# --- END AUTH env ---$/d' .env.local
            {
              echo "# --- BEGIN AUTH env (managed by GitHub Actions) ---"
              echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET"
              echo "# --- END AUTH env ---"
            } >> .env.local
            # Render the AI env block from GitHub environment secrets (idempotent:
            # replaces the previous managed block, never touches the rest of the file).
            sed -i '/^# --- BEGIN AI env (managed by GitHub Actions) ---$/,/^# --- END AI env ---$/d' .env.local
            {
              echo "# --- BEGIN AI env (managed by GitHub Actions) ---"
              echo "OPENAI_API_KEY=$OPENAI_API_KEY"
              echo "AI_ASSISTANT_ENABLED=true"
              echo "AI_INGESTION_ENABLED=true"
              # Outreach AI-drafting Stage 2 (docs/OUTREACH-AI-DRAFT-BRIEF.md). Still
              # double-gated: a tenant also needs tenants.ai_enabled (mig 174). Prod stays off.
              echo "AI_OUTREACH_DRAFT_ENABLED=true"
              # Phase 4 write tools on stage. Still double-gated: a tenant also
              # needs tenants.ai_enabled (mig 174), and every write is
              # approval-gated in the UI before it runs. Prod stays off.
              echo "AI_WRITE_TOOLS_ENABLED=true"
              # HMAC-signs the AI SDK's write-tool approval parts (5.3d). Without it
              # the SDK neither signs nor verifies, so an approval part can be forged
              # via curl — bounded to the caller's own authority, but it is a consent-
              # integrity gap and AI_WRITE_TOOLS_ENABLED is already true above, so this
              # is overdue rather than pre-emptive. Prod needs its OWN distinct value.
              echo "AI_TOOL_APPROVAL_SECRET=$AI_TOOL_APPROVAL_SECRET"
              # Phase 5 background/autonomous agents. Triple-gated: a tenant also needs
              # tenants.ai_enabled AND tenants.ai_agents_enabled (mig 185), and an admin
              # must explicitly hire an agent in Orca → Fleet. Prod stays off.
              echo "AI_AGENTS_ENABLED=true"
              # Phase 5 slice 5.5 MCP server at /api/mcp — the one externally-reachable
              # surface in the batch. Off => the route 404s outright. Still requires an
              # integration-category API key AND a hired "mcp-client" agent identity, so
              # enabling it here does not by itself expose any tenant's data. Prod stays off.
              echo "AI_MCP_ENABLED=true"
              # Pinned explicitly rather than inferred from which API key exists —
              # this value determines which third party receives customer data, so
              # changing it is a privacy-disclosure event (ADR-001 D5).
              echo "AI_PROVIDER=openai"
              echo "INNGEST_EVENT_KEY=$INNGEST_EVENT_KEY"
              echo "INNGEST_SIGNING_KEY=$INNGEST_SIGNING_KEY"
              echo "LANGFUSE_PUBLIC_KEY=$LANGFUSE_PUBLIC_KEY"
              echo "LANGFUSE_SECRET_KEY=$LANGFUSE_SECRET_KEY"
              echo "LANGFUSE_BASE_URL=https://cloud.langfuse.com"
              echo "# --- END AI env ---"
            } >> .env.local
            # Native email inbound (docs/email-productionization/INBOUND-SPINE-BRIEF.md)
            # — idempotent managed block, same pattern as the AI block above.
            sed -i '/^# --- BEGIN EMAIL INBOUND env (managed by GitHub Actions) ---$/,/^# --- END EMAIL INBOUND env ---$/d' .env.local
            {
              echo "# --- BEGIN EMAIL INBOUND env (managed by GitHub Actions) ---"
              # Comma-separated LIST, never a single value. The reply address is baked
              # into every email we have ever sent, so a retired domain must keep
              # resolving. First entry = the active domain new addresses mint on.
              # Free Resend plan allows 1 domain; add inbound.edgex.zunkireelabs.com
              # FIRST (keeping lead-crm in the list) when the Pro plan lands.
              echo "INBOUND_EMAIL_DOMAINS=lead-crm.zunkireelabs.com"
              # Stage and prod share one Resend account + one inbound domain, so BOTH
              # webhooks receive every email.received. Each env processes only its own
              # marker and silently ignores the other's — without this, stage would
              # dead-letter production mail and capture real customer PII. Prod = p.
              echo "INBOUND_ENV_MARKER=s"
              # Signs the address checksum. Prod needs its OWN distinct value.
              echo "INBOUND_TOKEN_SECRET=$INBOUND_TOKEN_SECRET"
              # Svix signing secret for the Resend email.received webhook. The route
              # fail-closes with 403 if unset.
              echo "RESEND_INBOUND_WEBHOOK_SECRET=$RESEND_INBOUND_WEBHOOK_SECRET"
              # Still per-tenant gated: a tenant also needs
              # tenant_email_settings.inbound_enabled (mig 191), default false, so
              # enabling here opts in no one. Prod stays off until the stage smoke passes.
              echo "EDGEX_INBOUND_ENABLED=true"
              echo "# --- END EMAIL INBOUND env ---"
            } >> .env.local
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "Waiting for container to be healthy..."
            sleep 10
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' leads-crm-dev 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                # Inngest sync. A NEW function — or a changed cron/event trigger — is not
                # registered with Inngest Cloud until the serve endpoint is PUT to, so it
                # ships DORMANT and its cron never fires. Function *body* changes don't
                # need this; registration changes do.
                # docs/reference/03-INNGEST-BACKGROUND-JOBS.md § "Deploy & sync" documents
                # it as a MANUAL step — which is exactly why it got skipped:
                # ops-email-inbound-process shipped unregistered on 2026-07-28 and inbound
                # email only moved when drained by hand. Automated so it cannot recur.
                # Idempotent — returns {"modified":false} when nothing changed.
                # Non-fatal: the deploy already succeeded and the container is healthy;
                # failing here would misreport a good deploy. Warns loudly instead.
                curl -fsS -X PUT https://dev-lead-crm.zunkireelabs.com/api/inngest \
                  && echo "Inngest sync OK" \
                  || echo "::warning::Inngest sync FAILED — run: curl -X PUT https://dev-lead-crm.zunkireelabs.com/api/inngest"
                exit 0
              fi
              echo "Attempt $i/18: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 3 minutes"
            docker logs leads-crm-dev --tail 50
            exit 1

      - name: Verify Health
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://dev-lead-crm.zunkireelabs.com/login || echo 000)
            if [ "$CODE" = "200" ]; then echo "Health OK (HTTP $CODE) on attempt $i"; exit 0; fi
            echo "Attempt $i/10: HTTP $CODE — waiting 15s..."; sleep 15
          done
          echo "Health check failed after retries"; exit 1
