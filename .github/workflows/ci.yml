name: CI

on:
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-guard:
    name: Migration Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every new migration must self-record in the ledger
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet
          BASE_REF="origin/${{ github.base_ref }}" bash scripts/check-migrations.sh

  destructive-script-guard:
    name: Destructive Script Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No workflow may invoke a destructive data script
        run: |
          # scrub-stage-pii.sh rewrites customer names/phones/emails in place and
          # is irreversible. It already refuses to target prod (no prod option +
          # URL marker abort), but "cannot be run automatically at all" is a
          # stronger guarantee than "refuses when asked". It is a human-run,
          # supervised tool — never a pipeline step.
          #
          # Deliberately greps the workflow directory only: the script is allowed
          # to exist, be reviewed and be documented; it just may never be wired
          # into automation.
          # --exclude=ci.yml so this guard doesn't match its own comments and
          # error message. ci.yml runs only on pull_request and holds no
          # database credentials, so it isn't a route to prod data anyway.
          if grep -rn "scrub-stage-pii" .github/workflows/ --exclude=ci.yml; then
            echo "::error::A workflow references the stage scrub script. It rewrites customer data irreversibly and must only ever be run by a human against local or stage. Remove the reference."
            exit 1
          fi
          echo "OK — no workflow invokes a destructive data script."

  promotion-guard:
    name: Promotion Source Guard
    runs-on: ubuntu-latest
    steps:
      - name: PRs to main may only come from stage or promote/*
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "✓ base is '${{ github.base_ref }}', not main — nothing to enforce."
            exit 0
          fi
          HEAD="${{ github.head_ref }}"
          case "$HEAD" in
            stage|promote/*)
              echo "✓ main PR head '$HEAD' is an allowed promotion source." ;;
            *)
              echo "✗ PRs to main may only come from 'stage' or a 'promote/*' branch (got '$HEAD')."
              echo "  main is PRODUCTION. Merge feature branches to stage first, then promote"
              echo "  stage → main. Direct-to-main merges are how main/stage diverge (see the"
              echo "  #138 incident in docs/dev-collab/DEV-WORKFLOW-AND-DEPLOYMENT.md)."
              exit 1 ;;
          esac

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx eslint --max-warnings 50

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test

  # Runs the suites that need a real Postgres + PostgREST, which `Test` above
  # cannot: it has no database, so ~26 tests covering SMS credit idempotency,
  # suppression lists and opt-out called ctx.skip() on EVERY run while the suite
  # still reported green. Review, not CI, caught the two HIGH credit-RPC bugs
  # those tests pin down. Separate job (not folded into `Test`) so the fast
  # feedback loop stays fast — the two run in parallel, so there is no
  # wall-clock cost — and so a failure here is attributable at a glance.
  #
  # The sequence mirrors the documented local setup exactly; do not shortcut it.
  # `[db.migrations] enabled = false` in supabase/config.toml means `supabase
  # start` applies NO migrations — the schema comes from the stage-derived
  # baseline loaded by [db.seed], and migrate-apply.sh then replays 128 -> HEAD
  # on top of it. That replay only became possible on 2026-09-07, when migs 180
  # and 223 stopped hard-seeding tenant-specific data (#508); before that the
  # chain could not run on a fresh database at all, which is precisely why this
  # job did not exist.
  test-db:
    name: Test (database-backed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      # `supabase start` on a fresh runner already initialises the DB, but reset is
      # explicit and deterministic: it re-applies the [db.seed] sql_paths
      # (baseline/schema.sql -> ledger.sql -> reference.sql -> seed.sql).
      # Schema-only: those four files carry 13 INSERTs total (reference lookups,
      # the ledger, one synthetic tenant) and zero rows of customer data.
      - name: Load baseline schema + ledger (seed paths in supabase/config.toml)
        run: supabase db reset

      - name: Replay migrations 128 -> HEAD onto the baseline
        run: ./scripts/migrate-apply.sh local

      - name: Seed local tenant + admin user
        run: ./scripts/local-db-setup.sh

      # email/outbound/send.test.ts probes `public.leads` and needs one row to
      # exist; the other five probe `tenants`, which the seed creates. The
      # baseline seeds ZERO leads, so that suite has only ever run on developer
      # machines that happened to have leads left over from other work — it is
      # non-deterministic by construction, and nobody noticed because it skipped
      # silently. Fixture here keeps CI honest; the suite should really create
      # its own (logged as a follow-up rather than widened into this PR).
      #
      # Inserted through `pipelines` rather than `tenants`: leads.pipeline_id is
      # NOT NULL (added after the baseline was cut, so it is not visible in
      # baseline/schema.sql's column list), and joining this way keeps tenant and
      # pipeline consistent by construction. supabase/seed.sql creates both.
      # Self-verifying: a 0-row insert raises instead of leaving the suite to
      # fail later with a misleading "database unreachable".
      - name: Seed one lead fixture (the email send suite probes public.leads)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n int;
          BEGIN
            INSERT INTO public.leads (tenant_id, pipeline_id, first_name, last_name, email)
            SELECT p.tenant_id, p.id, 'CI', 'Fixture', 'ci-fixture@zunkiree.invalid'
            FROM public.pipelines p
            ORDER BY p.created_at
            LIMIT 1;
            GET DIAGNOSTICS n = ROW_COUNT;
            IF n <> 1 THEN
              RAISE EXCEPTION 'lead fixture not created (% rows) — is supabase/seed.sql still creating a tenant + pipeline?', n;
            END IF;
            RAISE NOTICE 'lead fixture created';
          END $$;
          SQL

      - name: Run database-backed suites
        env:
          # NOT `CI` — GitHub sets that in every job, including the plain `Test`
          # one which has no database by design. This var is the promise that a
          # database exists, so a skip here is a hard failure.
          REQUIRE_LOCAL_DB: "1"
        run: |
          npx vitest run \
            src/lib/sms/credits-idempotency.test.ts \
            src/lib/sms/suppression.test.ts \
            src/lib/sms/optout.test.ts \
            src/lib/email/outbound/send.test.ts \
            src/lib/email/outbound/suppression.test.ts \
            src/lib/email/outbound/unsubscribe.test.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NODE_OPTIONS: --max-old-space-size=6144
